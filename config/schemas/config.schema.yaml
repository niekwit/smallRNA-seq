$schema: "https://json-schema.org/draft/2020-12/schema"
description: main configuration schema for the workflow

type: object

properties:
  genome:
    type: string
    description: The reference genome to be used.
    enum: ["hg38", "mm39"]

  release:
    type: integer
    description: Ensembl release number for reference data downloads.

  samples:
    type: object
    description: Mapping of sample names to their respective experimental conditions.
    additionalProperties:
      type: string

  reference_condition:
    type: string
    description: The condition to be used as the baseline for differential analysis.

  cutadapt:
    type: object
    properties:
      adapter:
        type: string
        description: 3' adapter sequence to be trimmed.
      extra:
        type: string
        description: Additional command line arguments for cutadapt.
    required: ["adapter"]

  tesmall:
    type: object
    properties:
      dbfolder:
        type: string
        description: Path to the TEsmall database directory.
      minlen:
        type: integer
        minimum: 0
      maxlen:
        type: integer
      maxaln:
        type: integer
      mismatch:
        type: integer
      extra_args:
        type: string
      te_classes:
        description: >
          TE classes to display in the top-families plot. Use "All" to include
          every class present in the data, or supply a list of class names from:
          DNA, LINE, LTR, RC, Retroposon, Satellite, SINE, Unknown, Unspecified.
        oneOf:
          - type: string
            const: "All"
          - type: array
            items:
              type: string
              enum:
                [
                  "DNA",
                  "LINE",
                  "LTR",
                  "RC",
                  "Retroposon",
                  "Satellite",
                  "SINE",
                  "Unknown",
                  "Unspecified",
                ]
            minItems: 1
    required: ["dbfolder", "minlen", "maxlen", "maxaln", "mismatch", "te_classes"]

  length_distribution:
    type: object
    properties:
      apply_mirna_correction:
        type: boolean
        description: Enable miRNA-based normalization for length distribution plots.
      mirna_correction_method:
        type: string
        description: >
          Method for miRNA-based normalization. "length" uses reads within a
          defined length window as a proxy for miRNA counts. "align" uses
          the count of reads that aligned to miRNA hairpin sequences.
        enum: ["length", "align"]
      mirna_min:
        type: integer
        description: >
          Minimum read length defining the miRNA window
          (mirna_correction_method = length only).
      mirna_max:
        type: integer
        description: >
          Maximum read length defining the miRNA window
          (mirna_correction_method = length only).
    required: ["apply_mirna_correction", "mirna_correction_method"]
    if:
      properties:
        apply_mirna_correction:
          const: true
        mirna_correction_method:
          const: length
      required: ["apply_mirna_correction", "mirna_correction_method"]
    then:
      required: ["mirna_min", "mirna_max"]

  bigwig:
    type: object
    properties:
      bin_size:
        type: integer
        description: Bin size (bp) passed to bamCoverage --binSize.
      read_length:
        type: integer
        description: >
          Read length used to select the effective genome size for
          bamCoverage. Must match one of the pre-computed values (50, 75,
          100, 150, 200).
        enum: [50, 75, 100, 150, 200]
      normalize_using:
        type: string
        description: >
          Normalisation method passed to bamCoverage --normalizeUsing.
          RPGC normalises to 1x genome coverage using the effective genome
          size; CPM and RPKM are read-count based; None disables
          normalisation. totalReads and miRNAReads are custom scale-factor
          methods (based on TEsmall count summaries) used for the
          strand-split TE bigWigs.
        enum: ["RPKM", "CPM", "BPM", "RPGC", "None", "totalReads", "miRNAReads"]
      extra:
        type: string
        description: Additional command line arguments passed to bamCoverage.
    required: ["bin_size", "read_length", "normalize_using", "extra"]

  pingpong:
    type: object
    properties:
      bowtie_params:
        type: string
        description: Bowtie alignment arguments used for the ping-pong analysis.
      fasta:
        type: string
        description: Path to the consensus sequence FASTA file.
      window:
        type: integer
        description: Analysis window size for ping-pong overlap distances.
      min_len:
        type: integer
        description: Minimum read length (inclusive) included in the ping-pong analysis.
      max_len:
        type: integer
        description: Maximum read length (inclusive) included in the ping-pong analysis.
      plot:
        type: object
        properties:
          type:
            type: string
            enum: ["line", "bar"]
            description: Plot type for ping-pong distance data.
          bar_position:
            type: string
            enum: ["grouped", "overlap"]
            description: Bar positioning when type is "bar". grouped uses dodged bars; overlap uses identity positioning with transparency.
        required: ["type"]
        if:
          properties:
            type:
              const: "bar"
          required: ["type"]
        then:
          required: ["bar_position"]
    required: ["bowtie_params", "fasta", "window", "min_len", "max_len", "plot"]

required:
  - genome
  - release
  - samples
  - reference_condition
  - cutadapt
  - tesmall
  - length_distribution
  - bigwig
  - pingpong
