genome: mm39 # hg38 or mm39
release: 115

samples:
  # sample: condition
  control_1: Control
  control_2: Control
  KO_1: KO
  KO_2: KO
reference_condition: Control

cutadapt:
  adapter: AGATCGGAAGA
  extra: "-m 16 --trimmed-only -q 20"

tesmall:
  dbfolder: /mnt/4TB_SSD/TEsmall_db/
  minlen: 16
  maxlen: 36
  maxaln: 100
  mismatch: 0
  extra_args: ""
  # TE classes to plot top 10 most abundent members
  # All, or a list: [LINE, LTR] (DNA/LINE/LTR/RC/Retroposon/Satellite/SINE/Unknown/Unspecified)
  te_classes: [LINE, LTR]

length_distribution:
  apply_mirna_correction: False # False will total count normalise
  mirna_correction_method: length # length or align

  # miRNA length range for correction
  # (for mirna_correction_method = length)
  mirna_min: 19
  mirna_max: 25

# Bigwig parameters
bigwig:
  bin_size: 10 # used to select effective genome size for bamCoverage
  read_length: 50 # used to select effective genome size for bamCoverage
  normalize_using: CPM # RPKM, CPM, BPM, RPGC, None, totalReads, miRNAReads
  extra: "" # additional bamCoverage arguments

pingpong:
  # bowtie alignment parameters for pingpong analysis
  # Suggested parameters:
  # --best -k 1 -v 3: Maximizing alignment yield (forces a reported home for every alignable read).
  # -n 2 -M 1 --best --strata --nomaqround: High-stringency filtering (strictly grouping by mismatch count and catching multi-mappers).
  bowtie_params: "--best -k 1 -v 3"
  fasta: resources/L1mTf.fa
  min_len: 23
  max_len: 32
  window: 30
  plot:
    type: line # line or bar
    bar_position: grouped # grouped or overlap (bar only)

# Integration with NGS Tracker for workflow registration and file attachment
# https://github.com/niekwit/ngs-tracker
ngs_tracker:
  enabled: false # set to true to enable registration

  # Connection
  base_url: "http://127.0.0.1:5000/api" # change host/port if needed

  # Run identity  (find project_id on the project detail page)
  project_id: 3
  #run_id: 1 # optional, if not provided a new run will be created
  workflow_name: "smallRNA-seq"
  workflow_tag: "v0.5.0"
  workflow_system: "snakemake" # snakemake | nextflow | cwl | other
  description: "smallRNA-seq"
  tags:
    - Test

  # Files to attach — paths relative to the working directory or absolute
  # type: config | sample_info | qc | results | mapping_rates | other
  files:
    - path: "config/config.yaml"
      type: config
      description: "Workflow config"
    - path: "results/plots/pca_plot.pdf"
      type: qc
      description: "PCA plot"
    - path: "results/plots/length_distribution*.pdf"
      type: results
      description: "Length distribution"
    - path: "results/plots/pingpong.pdf"
      type: results
      description: "Ping-pong plot"
    - path: "results/plots/rna_counts.pdf"
      type: qc
      description: "rRNA/miRNA counts per sample"
    - path: "results/plots/te_small/*.pdf"
      type: results
      description: "TE small"
    - path: "results/plots/te_pos_coverage/*.pdf"
      type: results
      description: "5'end position coverage"
    - path: "results/plots/pirna_sequence_bias/*.pdf"
      type: results
      description: "piRNA 1U/10A sequence bias"
    - path: logs/snakemake/*.log
      type: snakemake_log
