genome: mm39 # hg38 or mm39
release: 115

samples:
  # sample: condition
  control_1: Control
  control_2: Control
  KO_1: KO
  KO_2: KO
reference_condition: Control

cutadapt:
  adapter: AGATCGGAAGA
  extra: "-m 16 --trimmed-only -q 20"

tesmall:
  run_tesmall: False
  dbfolder: /mnt/4TB_SSD/TEsmall_db/
  minlen: 16
  maxlen: 36
  maxaln: 100
  mismatch: 0
  extra_args: ""

length_distribution:
  apply_mirna_correction: True # False will total count normalise
  mirna_correction_method: length # length or align

  # miRNA length range for correction
  # (for mirna_correction_method = length)
  mirna_min: 19
  mirna_max: 25

# miRNA Bigwig parameters
bigwig:
  read_length: 50 # used to select effective genome size for bamCoverage
  normalize_using: CPM # RPKM, CPM, BPM, RPGC, or None
  extra: "" # additional bamCoverage arguments

pingpong:
  mismatch: 3
  fasta: resources/L1mTf.fa
  window: 30
