genome: mm39 # hg38 or mm39

samples:
  # sample: condition
  control_1: WT
  control_2: WT
  KO_1: KO
  KO_2: KO
reference_condition: WT

cutadapt:
  adapter: AGATCGGAAGA
  extra: "-m 16 --trimmed-only -q 20"

tesmall:
  run_tesmall: False
  dbfolder: /mnt/4TB_SSD/TEsmall_db/
  minlen: 16
  maxlen: 36
  maxaln: 100
  mismatch: 0
  extra_args: ""

length_distribution:
  apply_mirna_correction: TRUE
  mirna_correction_method: length # length or align

  # miRNA length range for correction
  # (for mirna_correction_method = length)
  mirna_min: 19
  mirna_max: 25

pingpong:
  mismatch: 3
  fasta: resources/L1MdTf_III.fa
  window: 30
